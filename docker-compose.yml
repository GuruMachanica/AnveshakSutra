version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: anveshaksutra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anveshak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anveshak_secret}
      POSTGRES_DB: ${POSTGRES_DB:-anveshaksutra_db}
    ports:
      - "5432:5432"
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anveshaksutra_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - default

volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anveshak -d anveshaksutra_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anveshaksutra_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anveshaksutra_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anveshak}:${POSTGRES_PASSWORD:-anveshak_secret}@postgres:5432/${POSTGRES_DB:-anveshaksutra_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anveshaksutra_celery_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info -Q high_priority,matching,ingestion
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anveshak}:${POSTGRES_PASSWORD:-anveshak_secret}@postgres:5432/${POSTGRES_DB:-anveshaksutra_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend
      - redis
      - postgres

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anveshaksutra_celery_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anveshak}:${POSTGRES_PASSWORD:-anveshak_secret}@postgres:5432/${POSTGRES_DB:-anveshaksutra_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend
      - redis
      - postgres

volumes:
  postgres_data:
  redis_data:
